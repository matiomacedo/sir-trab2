<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Alunos</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Gestão de Alunos</h1>

    <form id="aluno-form" class="card">
      <h2>Novo aluno</h2>
      <div class="fields">
        <label>
          Nome
          <input id="nome" type="text" required minlength="2" maxlength="60" autocomplete="given-name" />
        </label>
        <label>
          Apelido
          <input id="apelido" type="text" required minlength="2" maxlength="60" autocomplete="family-name" />
        </label>
        <label>
          Curso
          <select id="curso" required>
            <option value="">Selecionar…</option>
          </select>
        </label>
        <label>
          Ano curricular
          <select id="ano" required>
            <option value="">Selecionar…</option>
            <option value="1">1.º ano</option>
            <option value="2">2.º ano</option>
            <option value="3">3.º ano</option>
          </select>
        </label>
        <label>
          Idade
          <input id="idade" type="number" min="0" max="120" />
        </label>
      </div>
      <div class="actions">
        <button type="submit">Adicionar</button>
      </div>
    </form>

    <p id="mensagem" role="alert" hidden></p>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Apelido</th>
            <th scope="col">Curso</th>
            <th scope="col">Ano</th>
            <th scope="col">Idade</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="alunos"></tbody>
      </table>
    </div>
  </main>

  <dialog id="dialogo-edicao" aria-labelledby="titulo-edicao">
    <form id="form-edicao">
      <h2 id="titulo-edicao">Editar aluno</h2>
      <div class="fields">
        <label>
          Nome
          <input id="editar-nome" type="text" required minlength="2" maxlength="60" autocomplete="given-name" />
        </label>
        <label>
          Apelido
          <input id="editar-apelido" type="text" required minlength="2" maxlength="60" autocomplete="family-name" />
        </label>
        <label>
          Curso
          <select id="editar-curso" required>
            <option value="">Selecionar…</option>
          </select>
        </label>
        <label>
          Ano curricular
          <select id="editar-ano" required>
            <option value="">Selecionar…</option>
            <option value="1">1.º ano</option>
            <option value="2">2.º ano</option>
            <option value="3">3.º ano</option>
          </select>
        </label>
        <label>
          Idade
          <input id="editar-idade" type="number" min="0" max="120" />
        </label>
      </div>
      <p id="erro-edicao" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" id="atualizar">Atualizar</button>
        <button type="button" id="cancelar-edicao">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="./js/app.js"></script>
</body>
</html>
