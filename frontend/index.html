<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Alunos</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Gestão de Alunos</h1>
      <button type="button" id="novo-aluno">Novo aluno</button>
    </header>

    <p id="mensagem" role="alert" hidden></p>

    <div class="card toolbar">
      <label>
        Curso
        <select id="filtro-curso">
          <option value="">Todos</option>
        </select>
      </label>
      <label>
        Ano curricular
        <select id="filtro-ano">
          <option value="">Todos</option>
          <option value="1">1.º ano</option>
          <option value="2">2.º ano</option>
          <option value="3">3.º ano</option>
        </select>
      </label>
      <label>
        Pesquisar
        <input id="filtro-texto" type="search" placeholder="Nome ou apelido" />
      </label>
      <button type="button" id="limpar-filtros">Limpar filtros</button>
    </div>

    <p id="contagem" class="contagem"></p>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col" data-campo="nome" aria-sort="ascending">
              <button type="button" class="sort-button">Nome</button>
            </th>
            <th scope="col" data-campo="apelido" aria-sort="none">
              <button type="button" class="sort-button">Apelido</button>
            </th>
            <th scope="col" data-campo="curso" aria-sort="none">
              <button type="button" class="sort-button">Curso</button>
            </th>
            <th scope="col" data-campo="anoCurricular" aria-sort="none">
              <button type="button" class="sort-button">Ano</button>
            </th>
            <th scope="col" data-campo="idade" aria-sort="none">
              <button type="button" class="sort-button">Idade</button>
            </th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="alunos"></tbody>
      </table>
    </div>
  </main>

  <dialog id="dialogo-aluno" aria-labelledby="titulo-aluno">
    <form id="form-aluno">
      <h2 id="titulo-aluno">Novo aluno</h2>
      <div class="fields">
        <label>
          Nome
          <input id="aluno-nome" type="text" required minlength="2" maxlength="60" autocomplete="given-name" />
        </label>
        <label>
          Apelido
          <input id="aluno-apelido" type="text" required minlength="2" maxlength="60" autocomplete="family-name" />
        </label>
        <label>
          Curso
          <select id="aluno-curso" required>
            <option value="">Selecionar…</option>
          </select>
        </label>
        <label>
          Ano curricular
          <select id="aluno-ano" required>
            <option value="">Selecionar…</option>
            <option value="1">1.º ano</option>
            <option value="2">2.º ano</option>
            <option value="3">3.º ano</option>
          </select>
        </label>
        <label>
          Idade
          <input id="aluno-idade" type="number" min="0" max="120" />
        </label>
      </div>
      <p id="erro-aluno" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" id="guardar-aluno">Adicionar</button>
        <button type="button" id="cancelar-aluno">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="./js/app.js"></script>
</body>
</html>
