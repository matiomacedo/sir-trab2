<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Alunos</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1>Gestão de Alunos</h1>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Filtros e ações">
      <div class="filters">
        <label class="field">
          <span>Curso</span>
          <select id="filter-curso">
            <option value="">Todos os cursos</option>
          </select>
        </label>
        <button type="button" id="btn-refresh" class="btn btn-secondary">Atualizar</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-new" class="btn btn-primary">+ Novo aluno</button>
      </div>
    </section>

    <p class="result-count" id="result-count" aria-live="polite"></p>

    <section aria-label="Lista de alunos">
      <div id="state-loading" class="state" hidden>A carregar alunos…</div>
      <div id="state-error" class="state state-error" hidden></div>
      <div id="state-empty" class="state" hidden>Nenhum aluno encontrado.</div>

      <div class="table-wrapper" id="table-wrapper" hidden>
        <table class="alunos-table">
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Apelido</th>
              <th scope="col">Curso</th>
              <th scope="col">Ano</th>
              <th scope="col">Idade</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="alunos-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="aluno-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="aluno-form" novalidate>
      <h2 id="dialog-title">Novo aluno</h2>
      <p class="form-error" id="aluno-form-error" hidden></p>
      <div class="form-grid">
        <label class="field">
          <span>Nome *</span>
          <input type="text" id="aluno-nome" minlength="2" maxlength="60" required autocomplete="given-name" />
        </label>
        <label class="field">
          <span>Apelido *</span>
          <input type="text" id="aluno-apelido" minlength="2" maxlength="60" required autocomplete="family-name" />
        </label>
        <label class="field">
          <span>Curso *</span>
          <select id="aluno-curso" required></select>
        </label>
        <label class="field">
          <span>Ano curricular *</span>
          <select id="aluno-ano" required>
            <option value="">Selecionar…</option>
            <option value="1">1.º ano</option>
            <option value="2">2.º ano</option>
            <option value="3">3.º ano</option>
          </select>
        </label>
        <label class="field">
          <span>Idade</span>
          <input type="number" id="aluno-idade" min="0" max="120" inputmode="numeric" />
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
        <button type="submit" id="btn-save" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="./js/app.js"></script>
</body>
</html>
